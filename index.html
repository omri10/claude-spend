<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Private</title>
<style>
:root{--bg:#f3f5f4;--box:#fff;--ink:#15201d;--sub:#5b6964;--line:#dde4e1;--accent:#1f5f75;--down:#b4372f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--box:#161e1c;--ink:#e6eeeb;--sub:#93a39e;--line:#26312e;--accent:#6fb4cc;--down:#f07a70;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;padding:16px}
form{width:100%;max-width:400px;background:var(--box);border:1px solid var(--line);border-radius:16px;padding:24px}
p{margin:0 0 14px;color:var(--sub);font-size:14px}
input[type=password]{width:100%;font:14px ui-monospace,Menlo,monospace;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:10px}
button{margin-top:12px;font:500 14px inherit;color:#fff;background:var(--accent);border:0;border-radius:99px;padding:8px 18px;cursor:pointer}
#err{color:var(--down);font-size:13px;min-height:1.2em;margin:8px 0 0}
</style>
</head>
<body>
<form id="f" autocomplete="off" hidden>
  <p>This page is encrypted. Open it with your private link, or paste the key.</p>
  <input id="k" type="password" spellcheck="false" placeholder="Key" aria-label="Key">
  <label><input id="r" type="checkbox" checked> Remember on this device</label>
  <p id="err"></p>
  <button type="submit">Unlock</button>
</form>
<script>
const KEY_RE=/^[A-Za-z0-9_-]{43}$/,LS="cs-key";
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
async function open_(k){
  const res=await fetch("vault.json",{cache:"no-store"});if(!res.ok)throw new Error("nodata");
  const env=await res.json(),key=await crypto.subtle.importKey("raw",ub64(k),"AES-GCM",false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(env.iv)},key,ub64(env.ct));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
async function tryKey(k,remember,silent){
  k=(k||"").trim().replace(/^#/,"");const err=document.getElementById("err");
  if(!KEY_RE.test(k)){if(!silent)err.textContent="That doesn't look like a valid key (43 characters).";return false}
  let html;try{html=await open_(k)}catch(e){if(!silent)err.textContent=e.message==="nodata"?"The data file couldn't be loaded. Try again in a minute.":"That key doesn't open this page.";return false}
  if(remember){try{localStorage.setItem(LS,k)}catch(_){}}
  if(location.hash)history.replaceState(null,"",location.pathname);
  document.open();document.write(html);document.close();return true;
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();tryKey(document.getElementById("k").value,document.getElementById("r").checked)});
(async()=>{
  const h=(location.hash||"").slice(1);let s=null;try{s=localStorage.getItem(LS)}catch(_){}
  if(h&&await tryKey(h,true,true))return;
  if(s&&await tryKey(s,false,true))return;
  document.getElementById("f").hidden=false;
  if(h)document.getElementById("err").textContent="The key in this link doesn't open this page.";
})();
</script>
</body>
</html>
